syntax = "proto3";
package baboflow.v1;
import "google/api/annotations.proto";
import "baboflow/v1/common.proto";
option go_package = "baboflow/api/baboflow/v1;v1";

message User { int64 userId = 1; string username = 2; string displayName = 3; bool mustChangePwd = 4; string avatar = 5; string email = 6; }
message LoginRequest { string username = 1; string password = 2; }
message LogoutResponse { bool ok = 1; }
message ChangePasswordRequest { string oldPassword = 1; string newPassword = 2; }
service AuthService {
  // Old: POST /api/v1/auth/login.
  rpc Login(LoginRequest) returns (User) { option (google.api.http) = { post: "/api/v1/auth/login" body: "*" }; }
  // Old: POST /api/v1/auth/logout.
  rpc Logout(Empty) returns (LogoutResponse) { option (google.api.http) = { post: "/api/v1/auth/logout" body: "*" }; }
  // Old: GET /api/v1/auth/me.
  rpc GetMe(Empty) returns (User) { option (google.api.http) = { get: "/api/v1/auth/me" }; }
  // Old: PUT /api/v1/auth/password.
  rpc ChangePassword(ChangePasswordRequest) returns (LogoutResponse) { option (google.api.http) = { put: "/api/v1/auth/password" body: "*" }; }
}
