syntax = "proto3";
package baboflow.v1;
import "google/api/annotations.proto";
import "baboflow/v1/common.proto";
option go_package = "baboflow/api/baboflow/v1;v1";
message Board {
  int64 id           = 1;
  string name        = 2;
  string description = 3;
  string createdAt   = 4;
  string updatedAt   = 5;
}
message BoardTaskResult {
  string output = 1;
  string error  = 2;
}
message BoardTask {
  int64 id               = 1;
  int64 columnId         = 2;
  string title           = 3;
  string payload         = 4;
  string status          = 5;
  string assignedChainId = 6;
  int64 runId            = 7;
  BoardTaskResult result = 8;
  int32 retryMax         = 9;
  int32 retryCount       = 10;
  int32 timeoutSec       = 11;
  int64 sort             = 12;
  string createdAt       = 13;
  string updatedAt       = 14;
}
message BoardColumn {
  int64 id                 = 1;
  int64 boardId            = 2;
  string name              = 3;
  int64 sort               = 4;
  repeated BoardTask tasks = 5;
}
message BoardDetail {
  int64 id                     = 1;
  string name                  = 2;
  string description           = 3;
  string createdAt             = 4;
  string updatedAt             = 5;
  repeated BoardColumn columns = 6;
}
message BoardInput {
  string name        = 1;
  string description = 2;
}
message BoardRequest {
  int64 id           = 1;
  string name        = 2;
  string description = 3;
}
message BoardIdRequest {
  int64 id = 1;
}
message BoardList {
  repeated Board list = 1;
}
message ColumnInput {
  int64 boardId = 1;
  string name   = 2;
  int64 sort    = 3;
}
message ColumnRequest {
  int64 id    = 1;
  string name = 2;
  int64 sort  = 3;
}
message TaskInput {
  int64 columnId         = 1;
  string title           = 2;
  string payload         = 3;
  string assignedChainId = 4;
  int32 retryMax         = 5;
  int32 timeoutSec       = 6;
}
message TaskRequest {
  int64 id               = 1;
  string title           = 2;
  string payload         = 3;
  string assignedChainId = 4;
  int32 retryMax         = 5;
  int32 timeoutSec       = 6;
}
message MoveTaskRequest {
  int64 id         = 1;
  int64 toColumnId = 2;
  int64 toSort     = 3;
}
message BoardOk {
  bool ok = 1;
}
service BoardService {
  // Old: GET /api/v1/boards.
  rpc List(Empty) returns (BoardList) {
    option (google.api.http) = {
      get: "/api/v1/boards"
    };
  }
  // Old: POST /api/v1/boards.
  rpc Create(BoardInput) returns (Board) {
    option (google.api.http) = {
      post: "/api/v1/boards"
      body: "*"
    };
  }
  // Old: GET /api/v1/boards/{id}.
  rpc Get(BoardIdRequest) returns (BoardDetail) {
    option (google.api.http) = {
      get: "/api/v1/boards/{id}"
    };
  }
  // Old: PUT /api/v1/boards/{id}.
  rpc Update(BoardRequest) returns (BoardOk) {
    option (google.api.http) = {
      put: "/api/v1/boards/{id}"
      body: "*"
    };
  }
  // Old: DELETE /api/v1/boards/{id}.
  rpc Delete(BoardIdRequest) returns (BoardOk) {
    option (google.api.http) = {
      delete: "/api/v1/boards/{id}"
    };
  }
  // Old: POST /api/v1/boards/{id}/columns.
  rpc CreateColumn(ColumnInput) returns (BoardColumn) {
    option (google.api.http) = {
      post: "/api/v1/board-columns"
      body: "*"
    };
  }
  // Old: PUT /api/v1/boards/columns/{id}.
  rpc UpdateColumn(ColumnRequest) returns (BoardOk) {
    option (google.api.http) = {
      put: "/api/v1/board-columns/{id}"
      body: "*"
    };
  }
  // Old: DELETE /api/v1/boards/columns/{id}.
  rpc DeleteColumn(BoardIdRequest) returns (BoardOk) {
    option (google.api.http) = {
      delete: "/api/v1/board-columns/{id}"
    };
  }
  // Old: POST /api/v1/boards/columns/{columnId}/tasks.
  rpc CreateTask(TaskInput) returns (BoardTask) {
    option (google.api.http) = {
      post: "/api/v1/tasks"
      body: "*"
    };
  }
  // Old: PUT /api/v1/tasks/{id}.
  rpc UpdateTask(TaskRequest) returns (BoardOk) {
    option (google.api.http) = {
      put: "/api/v1/tasks/{id}"
      body: "*"
    };
  }
  // Old: DELETE /api/v1/tasks/{id}.
  rpc DeleteTask(BoardIdRequest) returns (BoardOk) {
    option (google.api.http) = {
      delete: "/api/v1/tasks/{id}"
    };
  }
  // Old: POST /api/v1/tasks/{id}/move.
  rpc MoveTask(MoveTaskRequest) returns (BoardOk) {
    option (google.api.http) = {
      post: "/api/v1/tasks/{id}/move"
      body: "*"
    };
  }
  // Old: POST /api/v1/tasks/{id}/trigger.
  rpc TriggerTask(BoardIdRequest) returns (BoardTask) {
    option (google.api.http) = {
      post: "/api/v1/tasks/{id}/trigger"
      body: "*"
    };
  }
}
